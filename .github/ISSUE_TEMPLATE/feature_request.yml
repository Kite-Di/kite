name: Feature request
description: Something Kite cannot express, or expresses badly.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Kite's design says the graph is inferred and only decisions are written
        down. A request that adds a new annotation or a new concept has to argue
        against that — so describe the problem first, and the solution second.

  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The situation in your codebase, not the API you have in mind.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What you do today instead
      description: Including "nothing, I gave up" — that is useful information.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you think should happen
      description: Optional. Sketch the code you would want to write.
      render: kotlin

  - type: textarea
    id: elsewhere
    attributes:
      label: How another framework solves it
      description: >
        Optional, but helpful — including whether you think their answer is the
        right one.
