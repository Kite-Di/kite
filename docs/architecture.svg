<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6472"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d52"/>
    </marker>
  </defs>

  <rect width="980" height="620" fill="#fafbfc"/>
  <text x="490" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2430">How Kite works in your app</text>

  <!-- ============ COLUMN 1: YOU WRITE ============ -->
  <rect x="24" y="60" width="280" height="420" rx="10" fill="#eef4fb" stroke="#b9cfe8"/>
  <text x="164" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6f">1 · You write</text>

  <rect x="44" y="102" width="240" height="112" rx="6" fill="#ffffff" stroke="#b9cfe8"/>
  <text x="56" y="124" font-size="11" fill="#7a4fbf">@Injectable @Singleton</text>
  <text x="56" y="141" font-size="11" fill="#1f2430">class RealRepo(api: Api)</text>
  <text x="56" y="158" font-size="11" fill="#1f2430">    : UserRepo</text>
  <text x="56" y="182" font-size="11" fill="#7a4fbf">@Module object AppModule {</text>
  <text x="56" y="199" font-size="11" fill="#1f2430">  @Provides fun api(): Api …}</text>

  <rect x="44" y="230" width="240" height="96" rx="6" fill="#ffffff" stroke="#b9cfe8"/>
  <text x="56" y="252" font-size="11" fill="#1f2430">class First : Fragment() {</text>
  <text x="56" y="269" font-size="11" fill="#1f2430">  val p: Presenter</text>
  <text x="76" y="286" font-size="11" fill="#2e7d52">by injected()</text>
  <text x="56" y="303" font-size="11" fill="#1f2430">}</text>

  <rect x="44" y="342" width="240" height="78" rx="6" fill="#ffffff" stroke="#b9cfe8"/>
  <text x="56" y="364" font-size="11" fill="#1f2430">class App : Application() {</text>
  <text x="56" y="381" font-size="11" fill="#2e7d52">  Injector.init(this)</text>
  <text x="56" y="398" font-size="11" fill="#1f2430">}   // once, in onCreate</text>

  <text x="164" y="448" text-anchor="middle" font-size="11" fill="#5b6472">annotations only —</text>
  <text x="164" y="464" text-anchor="middle" font-size="11" fill="#5b6472">no components, no registration</text>

  <!-- arrow col1 -> col2 -->
  <line x1="304" y1="270" x2="352" y2="270" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="328" y="258" text-anchor="middle" font-size="10" fill="#5b6472">build</text>

  <!-- ============ COLUMN 2: COMPILE TIME ============ -->
  <rect x="356" y="60" width="280" height="420" rx="10" fill="#fdf6ec" stroke="#e6cf9f"/>
  <text x="496" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6116">2 · Compile time (KSP)</text>

  <rect x="376" y="102" width="240" height="120" rx="6" fill="#ffffff" stroke="#e6cf9f"/>
  <text x="388" y="124" font-size="12" font-weight="bold" fill="#1f2430">Validates the whole graph</text>
  <text x="388" y="146" font-size="11" fill="#5b6472">✗ missing binding</text>
  <text x="388" y="163" font-size="11" fill="#5b6472">✗ duplicate binding</text>
  <text x="388" y="180" font-size="11" fill="#5b6472">✗ dependency cycle</text>
  <text x="388" y="197" font-size="11" fill="#5b6472">✗ scope violation</text>
  <text x="388" y="214" font-size="11" fill="#c0392b">→ build error @ file:line</text>

  <rect x="376" y="238" width="240" height="104" rx="6" fill="#ffffff" stroke="#e6cf9f"/>
  <text x="388" y="260" font-size="12" font-weight="bold" fill="#1f2430">Generates plain code</text>
  <text x="388" y="282" font-size="11" fill="#5b6472">RealRepo_Factory      // new</text>
  <text x="388" y="299" font-size="11" fill="#5b6472">Main_MemberInjector   // fields</text>
  <text x="388" y="316" font-size="11" fill="#5b6472">MergedRegistry        // the map</text>
  <text x="388" y="333" font-size="11" fill="#2e7d52">no reflection, R8-safe</text>

  <rect x="376" y="358" width="240" height="62" rx="6" fill="#ffffff" stroke="#e6cf9f"/>
  <text x="388" y="380" font-size="12" font-weight="bold" fill="#1f2430">Exports graph.json</text>
  <text x="388" y="399" font-size="11" fill="#5b6472">→ app/build/Kite/</text>
  <text x="388" y="414" font-size="11" fill="#c0392b">build dir only — never in APK</text>

  <text x="496" y="448" text-anchor="middle" font-size="11" fill="#5b6472">wrong wiring can't reach</text>
  <text x="496" y="464" text-anchor="middle" font-size="11" fill="#5b6472">the device — it fails the build</text>

  <!-- arrow col2 -> col3 (runtime) -->
  <line x1="636" y1="200" x2="684" y2="200" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="660" y="188" text-anchor="middle" font-size="10" fill="#5b6472">APK</text>

  <!-- arrow col2 -> board (dev machine) -->
  <path d="M 496 480 L 496 530 L 664 530" fill="none" stroke="#2e7d52" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="530" y="521" font-size="10" fill="#2e7d52">graph.json (watched)</text>

  <!-- ============ COLUMN 3: RUNTIME ============ -->
  <rect x="688" y="60" width="268" height="420" rx="10" fill="#eefaf1" stroke="#a9d8b8"/>
  <text x="822" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#256b43">3 · Runtime (on device)</text>

  <rect x="708" y="102" width="228" height="88" rx="6" fill="#ffffff" stroke="#a9d8b8"/>
  <text x="720" y="124" font-size="12" font-weight="bold" fill="#1f2430">Container</text>
  <text x="720" y="146" font-size="11" fill="#5b6472">Key(Foo::class.java) → Factory</text>
  <text x="720" y="163" font-size="11" fill="#5b6472">map lookup + constructor call</text>
  <text x="720" y="180" font-size="11" fill="#2e7d52">that's the whole trick</text>

  <rect x="708" y="206" width="228" height="150" rx="6" fill="#ffffff" stroke="#a9d8b8"/>
  <text x="720" y="228" font-size="12" font-weight="bold" fill="#1f2430">Scope tree (automatic)</text>
  <text x="720" y="252" font-size="11" fill="#5b6472">App @Singleton</text>
  <text x="720" y="270" font-size="11" fill="#5b6472"> └ Activity @ActivityScoped</text>
  <text x="720" y="288" font-size="11" fill="#5b6472">    └ Fragment @FragmentScoped</text>
  <text x="720" y="312" font-size="11" fill="#5b6472">opens/closes with lifecycles,</text>
  <text x="720" y="329" font-size="11" fill="#5b6472">survives rotation, fills @Inject</text>
  <text x="720" y="346" font-size="11" fill="#5b6472">fields before onCreate</text>

  <rect x="708" y="372" width="228" height="48" rx="6" fill="#ffffff" stroke="#a9d8b8"/>
  <text x="720" y="392" font-size="11" fill="#5b6472">unscoped = new instance each time</text>
  <text x="720" y="409" font-size="11" fill="#5b6472">scoped = cached in its scope node</text>

  <text x="822" y="448" text-anchor="middle" font-size="11" fill="#5b6472">ships in the APK: registry +</text>
  <text x="822" y="464" text-anchor="middle" font-size="11" fill="#5b6472">factories + tiny runtime. Nothing else.</text>

  <!-- ============ DEV MACHINE BOARD ============ -->
  <rect x="668" y="500" width="288" height="96" rx="10" fill="#f4effb" stroke="#c9b6e8"/>
  <text x="812" y="524" text-anchor="middle" font-size="13" font-weight="bold" fill="#5b3d8f">Web board — dev machine only</text>
  <text x="812" y="546" text-anchor="middle" font-size="11" fill="#5b6472">./gradlew kiteBoard → localhost:8394</text>
  <text x="812" y="563" text-anchor="middle" font-size="11" fill="#5b6472">live canvas: rebuild → graph animates;</text>
  <text x="812" y="580" text-anchor="middle" font-size="11" fill="#5b6472">click a node → provided-from / injected-into</text>

  <!-- separation note -->
  <rect x="24" y="500" width="612" height="96" rx="10" fill="#fff" stroke="#e3e6ea"/>
  <text x="40" y="524" font-size="12" font-weight="bold" fill="#1f2430">The line that never gets crossed</text>
  <text x="40" y="546" font-size="11" fill="#5b6472">graph.json, the board and the server live on your machine. No APK — debug or release —</text>
  <text x="40" y="563" font-size="11" fill="#5b6472">contains the graph, a server, or the INTERNET permission. Runtime keys are Class refs,</text>
  <text x="40" y="580" font-size="11" fill="#5b6472">so no class-name strings ship either (scripts/check-apk-safety.sh enforces all of this).</text>
</svg>
