name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gradle:
    name: Gradle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # -PskipWebboard: the board's UI bundle needs npm and is covered by the
      # webboard job. The board server itself still compiles and runs its tests.
      - name: Build and test
        run: >
          ./gradlew
          :app:assembleDebug
          :app:testDebugUnitTest
          :kite:processor:test
          :kite:graph-core:test
          :kite:board:test
          -PskipWebboard

      # The guarantee the whole design rests on: no APK carries the graph, the
      # board, the inspector or the INTERNET permission.
      - name: Assert APKs stay clean
        run: |
          ./gradlew :app:assembleRelease -PskipWebboard
          ./scripts/check-apk-safety.sh

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          retention-days: 7

  webboard:
    name: Web board
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webboard/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build
