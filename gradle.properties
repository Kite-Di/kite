# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# --- Publication ------------------------------------------------------------
# Coordinates and POM for every published module, in one place. The Gradle
# plugin lives in its own build and therefore carries its own copy of these
# (kite/gradle-plugin/gradle.properties) — keep the two in step.
#
# GROUP is the reverse of a domain verified on the Central Portal. Everything
# under it (com.kitedi.*) is ours once kitedi.com is verified once.
GROUP=com.kitedi
VERSION_NAME=0.1.0

POM_URL=https://github.com/Kite-Di/kite/
POM_INCEPTION_YEAR=2026

POM_LICENSE_NAME=The Apache License, Version 2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENSE_DIST=repo

POM_SCM_URL=https://github.com/Kite-Di/kite/
POM_SCM_CONNECTION=scm:git:git://github.com/Kite-Di/kite.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/Kite-Di/kite.git

POM_DEVELOPER_ID=Kite-Di
POM_DEVELOPER_NAME=Max
POM_DEVELOPER_URL=https://github.com/Kite-Di/

# Central requires signed artifacts. Local smoke-testing against mavenLocal
# needs no key: ./gradlew publishToMavenLocal -PsignAllPublications=false
mavenCentralPublishing=true
signAllPublications=true