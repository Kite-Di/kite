name: Compatibility

# Builds a consumer project against several toolchains, so the range README
# claims is something that was run rather than something that was assumed.
# Kite comes from mavenLocal, so this tests the working tree, not a release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consumer:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.expected == 'fail' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Gradle 9.4.1 / AGP 9.2.1 / Kotlin 2.3.21 / KSP 2.3.9
            gradle: 9.4.1
            agp: 9.2.1
            kotlin: 2.3.21
            ksp: 2.3.9
            expected: pass
          - label: Gradle 9.6.0 / AGP 9.4.1 / Kotlin 2.3.21 / KSP 2.3.12
            gradle: 9.6.0
            agp: 9.4.1
            kotlin: 2.3.21
            ksp: 2.3.12
            expected: pass
          # The older line still in wide use: Play only requires targetSdk 36,
          # and Wear OS, Automotive, TV and XR are lower still.
          - label: Gradle 9.4.1 / AGP 8.13.2 / Kotlin 2.2.21 / KSP 2.2.21-2.0.5
            gradle: 9.4.1
            agp: 8.13.2
            kotlin: 2.2.21
            ksp: 2.2.21-2.0.5
            expected: pass

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The fixture resolves Kite from mavenLocal, so it has to be there first.
      # Built with the repository's own wrapper, not the matrix version.
      # -PsignAllPublications=false: there is no signing key in this workflow and
      # a local install needs none. Only the release workflow signs.
      - name: Install Kite into mavenLocal
        run: |
          ./gradlew publishToMavenLocal -PskipWebboard -PsignAllPublications=false
          ./gradlew -p kite/gradle-plugin publishToMavenLocal -PsignAllPublications=false

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}

      # --configuration-cache deliberately: it is on by default in new Gradle 9
      # projects, and a plugin that breaks it breaks every consumer's build.
      - name: Build the consumer project
        run: >
          gradle -p demo/consumer_app :app:assembleDebug
          --configuration-cache
          -PagpVersion=${{ matrix.agp }}
          -PkotlinVersion=${{ matrix.kotlin }}
          -PkspVersion=${{ matrix.ksp }}
          -PkiteVersion=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          -Pkite.startBoard=false

      # A module reachable only through another module's `implementation` is not
      # on the app's compile classpath: its registry is missing from the merge and
      # resolution would fail on the device. The aggregate pass has to refuse to
      # build it, and has to stay quiet when the same graph is exported with api().
      - name: A module missing from the merge fails the build
        run: |
          kite=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          common="-PagpVersion=${{ matrix.agp }} -PkotlinVersion=${{ matrix.kotlin }} -PkspVersion=${{ matrix.ksp }} -PkiteVersion=$kite -Pkite.startBoard=false"

          if gradle -p demo/transitive_app :app:assembleDebug $common > transitive.log 2>&1; then
            echo "::error::the build succeeded, but :deep is not on the app's compile classpath"
            exit 1
          fi
          grep -q "Unreachable dependency" transitive.log || {
            echo "::error::the build failed for some other reason"; cat transitive.log; exit 1;
          }

          gradle -p demo/transitive_app :app:assembleDebug $common -PdeepVisibility=api

  # A real plugin architecture: features register by implementing a contract, and
  # the app names none of them. It does not build yet — Set<I> collects only the
  # implementations compiled in the same module, so the aggregators in :core:plugin
  # see none of the features' contributions. Kept running and allowed to fail, so
  # the day cross-module contributions land this job turns green by itself.
  plugin-architecture:
    name: Plugin architecture (not supported yet)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Kite into mavenLocal
        run: |
          ./gradlew publishToMavenLocal -PskipWebboard -PsignAllPublications=false
          ./gradlew -p kite/gradle-plugin publishToMavenLocal -PsignAllPublications=false

      - name: Build it
        run: >
          ./gradlew -p demo/plugin_app :app:assembleDebug
          -PkiteVersion=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          -Pkite.startBoard=false
