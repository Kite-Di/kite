name: Compatibility

# Builds a consumer project against several toolchains, so the range README
# claims is something that was run rather than something that was assumed.
# Kite comes from mavenLocal, so this tests the working tree, not a release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consumer:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.expected == 'fail' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Gradle 9.4.1 / AGP 9.2.1 / Kotlin 2.3.21 / KSP 2.3.9
            gradle: 9.4.1
            agp: 9.2.1
            kotlin: 2.3.21
            ksp: 2.3.9
            expected: pass
          - label: Gradle 9.6.0 / AGP 9.4.1 / Kotlin 2.3.21 / KSP 2.3.12
            gradle: 9.6.0
            agp: 9.4.1
            kotlin: 2.3.21
            ksp: 2.3.12
            expected: pass
          # The older line still in wide use: Play only requires targetSdk 36,
          # and Wear OS, Automotive, TV and XR are lower still.
          - label: Gradle 9.4.1 / AGP 8.13.2 / Kotlin 2.2.21 / KSP 2.2.21-2.0.5
            gradle: 9.4.1
            agp: 8.13.2
            kotlin: 2.2.21
            ksp: 2.2.21-2.0.5
            expected: pass

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The fixture resolves Kite from mavenLocal, so it has to be there first.
      # Built with the repository's own wrapper, not the matrix version.
      # -PsignAllPublications=false: there is no signing key in this workflow and
      # a local install needs none. Only the release workflow signs.
      - name: Install Kite into mavenLocal
        run: |
          ./gradlew publishToMavenLocal -PskipWebboard -PsignAllPublications=false
          ./gradlew -p kite/gradle-plugin publishToMavenLocal -PsignAllPublications=false

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}

      # --configuration-cache deliberately: it is on by default in new Gradle 9
      # projects, and a plugin that breaks it breaks every consumer's build.
      - name: Build the consumer project
        run: >
          gradle -p demo/consumer_app :app:assembleDebug
          --configuration-cache
          -PagpVersion=${{ matrix.agp }}
          -PkotlinVersion=${{ matrix.kotlin }}
          -PkspVersion=${{ matrix.ksp }}
          -PkiteVersion=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          -Pkite.startBoard=false

      # A module reachable only through another module's `implementation` is not
      # on the app's compile classpath: its registry is missing from the merge and
      # resolution would fail on the device. The aggregate pass has to refuse to
      # build it, and has to stay quiet when the same graph is exported with api().
      - name: A module missing from the merge fails the build
        run: |
          kite=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          common="-PagpVersion=${{ matrix.agp }} -PkotlinVersion=${{ matrix.kotlin }} -PkspVersion=${{ matrix.ksp }} -PkiteVersion=$kite -Pkite.startBoard=false"

          if gradle -p demo/transitive_app :app:assembleDebug $common > transitive.log 2>&1; then
            echo "::error::the build succeeded, but :deep is not on the app's compile classpath"
            exit 1
          fi
          grep -q "Unreachable dependency" transitive.log || {
            echo "::error::the build failed for some other reason"; cat transitive.log; exit 1;
          }

          gradle -p demo/transitive_app :app:assembleDebug $common -PdeepVisibility=api

      # The same defect one layer deeper: the module that cannot be reached exports
      # no keys at all, because its only graph content is a ViewModel — an entry
      # point, not a binding. There is no constructor for the application to re-read,
      # so ClosureValidator is blind and only the modules a registry records as
      # required can catch it. Kept in its own fixture: in transitive_app the binding
      # case would report the same error and mask a regression here.
      - name: A ViewModel-only module missing from the merge fails the build
        run: |
          kite=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          common="-PagpVersion=${{ matrix.agp }} -PkotlinVersion=${{ matrix.kotlin }} -PkspVersion=${{ matrix.ksp }} -PkiteVersion=$kite -Pkite.startBoard=false"

          if gradle -p demo/viewmodel_merge_app :app:assembleDebug $common > vm.log 2>&1; then
            echo "::error::the build succeeded, but :data is not on the app's compile classpath"
            exit 1
          fi
          grep -q "Module :data is missing from the merged graph" vm.log || {
            echo "::error::the build failed for some other reason"; cat vm.log; exit 1;
          }

          gradle -p demo/viewmodel_merge_app :app:assembleDebug $common -PdataVisibility=api

      # AGP refuses every external `compileOnly` dependency on a base module that
      # declares a dynamic feature, and Kite's rules vocabulary is compileOnly
      # everywhere it is allowed to be. Project dependencies are exempt, so no
      # in-repo demo can catch this — only a fixture resolving Kite from mavenLocal.
      # The release half matters just as much: the vocabulary arrives on
      # `implementation` here, and R8 has to delete it again.
      - name: An app with a dynamic feature builds, and ships none of the vocabulary
        run: |
          kite=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          common="-PagpVersion=${{ matrix.agp }} -PkotlinVersion=${{ matrix.kotlin }} -PkspVersion=${{ matrix.ksp }} -PkiteVersion=$kite -Pkite.startBoard=false"

          gradle -p demo/dynamic_app :app:assembleDebug $common
          gradle -p demo/dynamic_app :app:assembleRelease $common
          scripts/check-apk-safety.sh demo/dynamic_app/app/build/outputs/apk/release/app-release-unsigned.apk

  # A real plugin architecture: three features register by implementing contracts
  # from :core:plugin, and the app names none of them. The unit tests assert the
  # composed sets, so a regression in cross-module contributions fails here.
  plugin-architecture:
    name: Plugin architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Kite into mavenLocal
        run: |
          ./gradlew publishToMavenLocal -PskipWebboard -PsignAllPublications=false
          ./gradlew -p kite/gradle-plugin publishToMavenLocal -PsignAllPublications=false

      - name: Build it and check what the sets collected
        run: >
          ./gradlew -p demo/plugin_app :app:testDebugUnitTest
          -PkiteVersion=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          -Pkite.startBoard=false
